[project]
name = "claude-elastic-tracing"
version = "0.1.0"
description = "Smoke test for Claude SDK tracing to Elastic Managed OTLP"
requires-python = ">=3.10"
dependencies = [
    "anthropic",
    "opentelemetry-sdk",
    "opentelemetry-exporter-otlp-proto-http",
]

[project.scripts]
claude-tracing = "claude_tracing:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["claude_tracing"]
